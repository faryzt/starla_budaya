      // 1. Storage wipe on fresh access (Fresh start every access, Slide 1 / Intro Video)
      try {
        var wipe = function(store) {
          if (!store) return;
          var remove = [];
          for (var i = 0; i < store.length; i++) {
            var key = store.key(i);
            if (key) {
              var k = key.toLowerCase();
              if (k.indexOf('suspend') !== -1 || k.indexOf('resume') !== -1 ||
                  k.indexOf('starla') !== -1 || k.indexOf('5jpg') !== -1 ||
                  k.indexOf('5foc') !== -1 || k.indexOf('articulate') !== -1 ||
                  k.indexOf('storyline') !== -1) {
                remove.push(key);
              }
            }
          }
          remove.forEach(function(k) { store.removeItem(k); });
        };
        wipe(window.localStorage);
        wipe(window.sessionStorage);
      } catch(e){}

      window.addEventListener('beforeunload', function() {
        try {
          localStorage.removeItem('suspend_data');
          localStorage.removeItem('starla_mlbb_session_v2');
          localStorage.removeItem('starla_mlbb_session_v1');
          sessionStorage.clear();
        } catch(e){}
      });

      // 2. Prototype hook for HTMLMediaElement.prototype.play
      window.__starlaUserInteracted = false;
      var origPlay = HTMLMediaElement.prototype.play;
      HTMLMediaElement.prototype.play = function() {
        if (!window.__starlaUserInteracted && (this instanceof HTMLVideoElement || (this.tagName && this.tagName.toUpperCase() === 'VIDEO'))) {
          this.muted = true;
          this.playsInline = true;
          this.setAttribute('playsinline', '');
          this.setAttribute('webkit-playsinline', '');
        }
        return origPlay.apply(this, arguments);
      };

      // 3. Strict Screen Locking (Anti-Zoom)
      // Prevent multi-touch pinch zoom
      document.addEventListener('touchmove', function(e) {
        if (e.touches && e.touches.length > 1) {
          e.preventDefault();
        }
      }, { passive: false });

      // Prevent Safari gesture zoom
      ['gesturestart', 'gesturechange', 'gestureend'].forEach(function(evt) {
        document.addEventListener(evt, function(e) {
          e.preventDefault();
        }, { passive: false });
      });

      // Prevent double tap zoom
      var lastTouchEnd = 0;
      document.addEventListener('touchend', function(e) {
        var now = Date.now();
        if (now - lastTouchEnd <= 300) {
          if (!e.target || (e.target.tagName !== 'INPUT' && e.target.tagName !== 'TEXTAREA')) {
            e.preventDefault();
          }
        }
        lastTouchEnd = now;
      }, { passive: false });

      // Prevent dblclick zoom
      document.addEventListener('dblclick', function(e) {
        if (!e.target || (e.target.tagName !== 'INPUT' && e.target.tagName !== 'TEXTAREA')) {
          e.preventDefault();
        }
      }, { passive: false });

      // Prevent Ctrl/Cmd + Wheel zoom
      window.addEventListener('wheel', function(e) {
        if (e.ctrlKey || e.metaKey) {
          e.preventDefault();
        }
      }, { passive: false });

      // Prevent Ctrl/Cmd + (+, -, 0, =) keyboard zoom
      window.addEventListener('keydown', function(e) {
        if ((e.ctrlKey || e.metaKey) && (
          e.key === '+' || e.key === '-' || e.key === '=' || e.key === '0' ||
          e.keyCode === 187 || e.keyCode === 189 || e.keyCode === 48 ||
          e.keyCode === 96 || e.keyCode === 107 || e.keyCode === 109
        )) {
          e.preventDefault();
        }
      }, false);
    })();

    window.addEventListener('orientationchange', function() {

      });
    });

  <!-- STARLA Budaya - Front Stage 3D Nusantara Motion, Web Audio API & Mulai Controller -->
  <script>
    (function() {
      'use strict';
      var stageEl = document.getElementById('starla-front-stage');
      var startBtn = document.getElementById('starla-start-btn');
      var isStarted = false;

      // Pure Web Audio API: Nusantara Ambient Pad & Interactive Chimes (0 external files, 0 error 404)
      var StarlaAudio = (function() {
        var ctx = null;
        var masterGain = null;
        var ambientGain = null;
        var isAmbientRunning = false;
        var ambientTimer = null;
        var padOscs = [];

        function getContext() {
          if (!ctx) {
            var AudioContextClass = window.AudioContext || window.webkitAudioContext;
            if (AudioContextClass) {
              ctx = new AudioContextClass();
              masterGain = ctx.createGain();
              masterGain.gain.setValueAtTime(1, ctx.currentTime);
              masterGain.connect(ctx.destination);

              ambientGain = ctx.createGain();
              ambientGain.gain.setValueAtTime(0.0001, ctx.currentTime);
              ambientGain.connect(masterGain);
            }
          }
          if (ctx && ctx.state === 'suspended') {
            ctx.resume().catch(function(){});
          }
          return ctx;
        }

        var slendroFreqs = [261.63, 293.66, 329.63, 392.00, 440.00, 523.25, 587.33, 659.25];

        function startAmbient() {
          if (isAmbientRunning) return;
          var audio = getContext();
          if (!audio) return;
          isAmbientRunning = true;

          try {
            var filter = audio.createBiquadFilter();
            filter.type = 'lowpass';
            filter.frequency.setValueAtTime(360, audio.currentTime);
            filter.connect(ambientGain);

            var padNotes = [130.81, 196.00, 329.63];
            padNotes.forEach(function(freq, i) {
              var osc = audio.createOscillator();
              var oscGain = audio.createGain();
              osc.type = i === 1 ? 'triangle' : 'sine';
              osc.frequency.setValueAtTime(freq, audio.currentTime);
              osc.detune.setValueAtTime((i - 1) * 3, audio.currentTime);
              oscGain.gain.setValueAtTime(0.025, audio.currentTime);
              osc.connect(oscGain);
              oscGain.connect(filter);
              osc.start();
              padOscs.push({ osc: osc, gain: oscGain });
            });

            ambientGain.gain.cancelScheduledValues(audio.currentTime);
            ambientGain.gain.setValueAtTime(0.0001, audio.currentTime);
            ambientGain.gain.linearRampToValueAtTime(0.75, audio.currentTime + 2.0);

            function scheduleNextChime() {
              if (!isAmbientRunning) return;
              var nextDelay = 3000 + Math.random() * 1800;
              ambientTimer = setTimeout(function() {
                if (!isAmbientRunning) return;
                playSoftChime();
                scheduleNextChime();
              }, nextDelay);
            }

            function playSoftChime() {
              if (!audio || audio.state !== 'running') return;
              var noteIdx = Math.floor(Math.random() * slendroFreqs.length);
              var freq = slendroFreqs[noteIdx];
              var now = audio.currentTime;

              var chimeOsc = audio.createOscillator();
              var chimeGain = audio.createGain();
              chimeOsc.type = 'sine';
              chimeOsc.frequency.setValueAtTime(freq, now);

              var overtoneOsc = audio.createOscillator();
              var overtoneGain = audio.createGain();
              overtoneOsc.type = 'sine';
              overtoneOsc.frequency.setValueAtTime(freq * 2.75, now);

              chimeGain.gain.setValueAtTime(0.0001, now);
              chimeGain.gain.linearRampToValueAtTime(0.038, now + 0.04);
              chimeGain.gain.exponentialRampToValueAtTime(0.0001, now + 2.8);

              overtoneGain.gain.setValueAtTime(0.0001, now);
              overtoneGain.gain.linearRampToValueAtTime(0.012, now + 0.02);
              overtoneGain.gain.exponentialRampToValueAtTime(0.0001, now + 1.2);

              chimeOsc.connect(chimeGain);
              overtoneOsc.connect(overtoneGain);
              chimeGain.connect(ambientGain);
              overtoneGain.connect(ambientGain);

              chimeOsc.start(now);
              overtoneOsc.start(now);
              chimeOsc.stop(now + 2.9);
              overtoneOsc.stop(now + 1.3);
            }

            scheduleNextChime();
          } catch(e) {
            console.warn('[StarlaAudio] Ambient notice:', e);
          }
        }

        function fadeOutAmbient(duration) {
          if (!isAmbientRunning) return;
          isAmbientRunning = false;
          clearTimeout(ambientTimer);
          if (!ctx || !ambientGain) return;
          try {
            var d = duration || 0.6;
            var now = ctx.currentTime;
            ambientGain.gain.cancelScheduledValues(now);
            ambientGain.gain.setValueAtTime(ambientGain.gain.value, now);
            ambientGain.gain.linearRampToValueAtTime(0.0001, now + d);
            setTimeout(function() {
              padOscs.forEach(function(p) {

              });
              padOscs = [];
            }, (d + 0.1) * 1000);
          } catch(e){}
        }

          var audio = getContext();
          if (!audio) return;
          try {
            var now = audio.currentTime;
            var osc1 = audio.createOscillator();
            var osc2 = audio.createOscillator();

            osc1.type = 'sine';
            osc2.type = 'sine';

            osc2.frequency.setValueAtTime(1320, now);

            gainNode.gain.linearRampToValueAtTime(0.045, now + 0.015);

            osc2.connect(gainNode);

            osc1.start(now);
            osc2.start(now);
            osc1.stop(now + 0.3);
            osc2.stop(now + 0.3);
          } catch(e){}

          var audio = getContext();
          if (!audio) return;
          try {
            var now = audio.currentTime;
            var chord = [523.25, 659.25, 783.99, 1046.50];

<script>
  (function() {
    window.DS.connection = {
      warningShown: false,
      assets: {},
      loadingAssetGroup: false,
      retryDelay: 500
    };

    // @TODO this is POC code and can be cleaned up a bit more if we move forward
    // with the feature



    // The `window.globals.features` variable must be set in `webpack.dev.config` when testing locally - it is not enough
    // to have it in the data - but it must be set there as well.
    var useConnectionMessages = window.AbortController != null &&
      window.location.protocol != 'file:' &&
      window.globals.features.indexOf('ConnectionMessages') != -1;

    window.DS.connection.useConnectionMessages = useConnectionMessages

    var assetCount = 0;
    var checkLoadedId;
    var connectionSettings = window.globals.connectionSettings;

    if (useConnectionMessages && connectionSettings != null) {
      var contentEl = document.querySelector('.warn-connection-content');
      var messageEl = contentEl.querySelector('p')

      if (connectionSettings.useDarkTheme) {
        contentEl.style.borderColor = '#BABBBA';
        contentEl.style.backgroundColor = '#282828';
        contentEl.style.color = '#FFFFFF';
      }

      if (connectionSettings.message != null) {
        messageEl.textContent = window.decodeURIComponent(connectionSettings.message);
      }
    }

    function checkAssetsReady() {
      for (var i in DS.connection.assets) {
        if (!DS.connection.assets[i].success) {
          return false;
        }
      }
      return true;
    }

    function stopAssetGroup() {
      if (!useConnectionMessages) { return; }

      assetCount = 0;

      DS.connection.oldAssetGroup = DS.connection.assets;
      DS.connection.assets = {};
      DS.connection.loadingAssetGroup = false;
      clearInterval(checkLoadedId);
    }

    function startAssetGroup() {
      if (!useConnectionMessages) { return; }
      var ticks = 0;
      clearInterval(checkLoadedId);
      checkLoadedId = setInterval(function() {
        var loaded = 0;
        if (assetCount === 0 && loaded === 0) {
          clearInterval(checkLoadedId);
          return;
        }

        for (var i in DS.connection.assets) {
          if (DS.connection.assets[i].success) {
            loaded++;
          }
        }

        if (assetCount === loaded && checkAssetsReady()) {
          for (var i in DS.connection.assets) {
            if (DS.connection.assets[i].action) {
              DS.connection.assets[i].action();
            }
          }
          hideWarning();
          stopAssetGroup();
        }
      }, 100)
    }

    function requiredAsset(url, action, retry, type) {
      if (!useConnectionMessages) { return; }
      if (DS.connection.assets[url]) { return; }

      DS.connection.assets[url] = {
        success: false, action: action, retry: retry, type: type
      };
      assetCount = Object.keys(DS.connection.assets).length;
      if (!DS.connection.loadingAssetGroup) {
        startAssetGroup();
      }
      DS.connection.loadingAssetGroup = true;
    }

    function assetLoaded(url) {
      if (!useConnectionMessages) { return; }
      if (DS.connection.assets[url]) {
        DS.connection.assets[url].success = true;
      }
    }

    function assetFailed(url) {
      if (!useConnectionMessages) { return; }
      if (!DS.connection.assets[url]) {
        if (/\.js$/.test(url)) {
          setTimeout(function() {
            if (DS.connection.lastSlideLoaded != null) {
              DS.connection.lastSlideLoaded();
            }
          }, DS.connection.retryDelay);
        }
        return;
      }
      if (!DS.connection.warningShown) { showWarning(); }
      if (DS.connection.assets[url].retry) {
        setTimeout(function() {
          if (!DS.connection.assets[url].success) {
            DS.connection.assets[url].retry()
          }
        }, DS.connection.retryDelay);
      }
    }

    function hideWarning() {
      document.body.classList.remove('is-offline');
      DS.connection.warningShown = false;
    }
    DS.connection.hideWarning = hideWarning

    function showWarning(btn) {
      document.body.classList.add('is-offline')
      DS.connection.warningShown = true;
      updateWarningPosition();
    }

    function updateWarningPosition() {
      if (!DS.connection.warningShown) {
        return;
      }

      var isPortrait = document.body.classList.contains('is-portrait');
      var warningEl = document.querySelector('.warn-connection-content');

      if (isPortrait) {
        var slide = document.querySelector('.primary-slide');
        var slideRect = slide.getBoundingClientRect();

        warningEl.style.top = `${slideRect.top}px`
        warningEl.style.left = `${slideRect.left + slideRect.width / 2}px`
      } else {
        warningEl.style.top = null;
        warningEl.style.left = null;
      }

      window.requestAnimationFrame(updateWarningPosition);
    }

    // these will all be noops if the feature flag isn't set in
    // the data and `window.globals.features`
    DS.connection.requiredAsset = requiredAsset;
    DS.connection.assetLoaded = assetLoaded;
    DS.connection.assetFailed = assetFailed;
    DS.connection.stopAssetGroup = stopAssetGroup;
    DS.connection.startAssetGroup = startAssetGroup;
  })();
</script>
