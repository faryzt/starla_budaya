          var remove = [];
          for (var i = 0; i < store.length; i++) {
            var key = store.key(i);
            if (key) {
              var k = key.toLowerCase();

        wipe(window.sessionStorage);

      var origPlay = HTMLMediaElement.prototype.play;

          this.muted = true;
          this.playsInline = true;
          this.setAttribute('playsinline', '');
          this.setAttribute('webkit-playsinline', '');
        }
        return origPlay.apply(this, arguments);
      };

      // 3. Strict Screen Locking (Anti-Zoom)
      // Prevent multi-touch pinch zoom
      document.addEventListener('touchmove', function(e) {
        if (e.touches && e.touches.length > 1) {
          e.preventDefault();
        }
      }, { passive: false });

      // Prevent Safari gesture zoom
      ['gesturestart', 'gesturechange', 'gestureend'].forEach(function(evt) {
        document.addEventListener(evt, function(e) {
          e.preventDefault();
        }, { passive: false });
      });

      // Prevent double tap zoom
      var lastTouchEnd = 0;
      document.addEventListener('touchend', function(e) {
        var now = Date.now();
        if (now - lastTouchEnd <= 300) {
          if (!e.target || (e.target.tagName !== 'INPUT' && e.target.tagName !== 'TEXTAREA')) {
            e.preventDefault();
          }
        }
        lastTouchEnd = now;
      }, { passive: false });

      // Prevent dblclick zoom
      document.addEventListener('dblclick', function(e) {
        if (!e.target || (e.target.tagName !== 'INPUT' && e.target.tagName !== 'TEXTAREA')) {
          e.preventDefault();
        }
      }, { passive: false });

      // Prevent Ctrl/Cmd + Wheel zoom
      window.addEventListener('wheel', function(e) {
        if (e.ctrlKey || e.metaKey) {
          e.preventDefault();
        }
      }, { passive: false });

      // Prevent Ctrl/Cmd + (+, -, 0, =) keyboard zoom

      display: none;

    .starla-progress-track {

      width: 0%;

      box-shadow: 0 0 16px rgba(245, 158, 11, 0.95);
      transition: width 0.2s ease-out;

    .starla-progress-info {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;

    .starla-status-text {
      color: #cbd5e1;
      font-weight: 500;
      font-style: italic;
    }

    .starla-percent-text {
      color: #fbbf24;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    /* 6. Tactile Glass-Gold Bevel Single Start Button (#starla-start-btn) */
    .starla-start-btn {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 15px 52px;
      border-radius: 999px;
      background: linear-gradient(180deg, #fef08a 0%, #f59e0b 38%, #d97706 78%, #b45309 100%);
      border: 1.5px solid #fef08a;
      box-shadow: 
        0 0 0 1px rgba(255, 255, 255, 0.5) inset,
        0 2px 0 #78350f,
        0 8px 24px rgba(217, 119, 6, 0.7),
        0 16px 40px rgba(0, 0, 0, 0.75);
      color: #1a0f00;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-size: 19px;
      font-weight: 900;
      letter-spacing: 4px;
      text-transform: uppercase;
      cursor: pointer;
      outline: none;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.2s ease, opacity 0.45s ease;
      animation: starlaBtnPulse 2.4s infinite ease-in-out;
    }

    .starla-start-btn.starla-btn-hidden {
      display: none !important;
      opacity: 0 !important;
      pointer-events: none !important;
      transform: scale(0.92);
    }

    .starla-start-btn:hover {
      transform: scale(1.04) translateY(-2px);
      box-shadow: 
        0 0 0 1px rgba(255, 255, 255, 0.65) inset,
        0 3px 0 #78350f,
        0 12px 30px rgba(245, 158, 11, 0.85),
        0 20px 48px rgba(0, 0, 0, 0.85);
    }

    .starla-start-btn:active {
      transform: scale(0.97) translateY(2px);
      box-shadow: 
        0 0 0 1px rgba(255, 255, 255, 0.3) inset,
        0 1px 0 #78350f,
        0 4px 14px rgba(217, 119, 6, 0.5),
        0 8px 20px rgba(0, 0, 0, 0.7);
    }

    .starla-btn-shimmer {
      position: absolute;
      top: 0;
      left: -100%;
      width: 60%;
      height: 100%;
      background: linear-gradient(90deg, transparent 0%, rgba(255, 255, 255, 0.55) 50%, transparent 100%);
      transform: skewX(-25deg);
      animation: starlaShimmerSweep 3s infinite ease-in-out;
      pointer-events: none;
    }

    @keyframes starlaShimmerSweep {
      0% { left: -100%; }
      35%, 100% { left: 160%; }
    }

    @keyframes starlaBtnPulse {
      0%, 100% {
        transform: scale(1);
        box-shadow: 
          0 0 0 1px rgba(255, 255, 255, 0.5) inset,
          0 2px 0 #78350f,
          0 8px 24px rgba(217, 119, 6, 0.7),
          0 16px 40px rgba(0, 0, 0, 0.75);

      50% {
        transform: scale(1.03);

          0 0 0 1px rgba(255, 255, 255, 0.65) inset,
          0 2px 0 #78350f,
          0 12px 32px rgba(245, 158, 11, 0.92),
          0 20px 48px rgba(0, 0, 0, 0.85);

    }

    .smart-orientation-alert {
      position: fixed;
      top: 16px;
      left: 50%;

    .smart-orientation-alert.visible {

      transform: translateX(-50%) translateY(0);

    @keyframes starlaPhoneRotateAnim {
      0%, 15% { transform: rotate(0deg); }

      90%, 100% { transform: rotate(0deg); }

      font-size: 11px;

    .slide-layer:not(.base-layer) {

    /* 9. Top-Right Transparent Fullscreen Icon (#starla-fs-btn) */
    #starla-fs-btn {
      position: fixed;
      top: 14px;

  <!-- STARLA Budaya - Front Stage Motion Loading & Single Start Button Controller -->
  <script>
    (function() {
      'use strict';
      var startTime = Date.now();
      var stageEl = document.getElementById('starla-front-stage');
      var progressBox = document.getElementById('starla-progress-box');
      var fillEl = document.getElementById('starla-progress-fill');
      var statusEl = document.getElementById('starla-status-text');
      var percentEl = document.getElementById('starla-percent-text');
      var startBtn = document.getElementById('starla-start-btn');
      var isReady = false;
      var isStarted = false;
      var currentProgress = 0;

      // Status messages
      var statusMessages = [
        { at: 0, text: 'Menyiapkan Petualangan Nusantara...' },
        { at: 35, text: 'Memuat Media Interaktif...' },
        { at: 70, text: 'Mengaktifkan Eksplorasi Murid...' },
        { at: 98, text: 'Siap Dimainkan!' }
      ];

      // Warm critical assets in background
      var warmAssets = [
        'story_content/video_6nPjLwNxeE5_22_56_1280x720.mp4',
        'mobile/Slide6OyJsyjTUqI.jpg',
        'story_content/6DeuLJzk41Q_44100_56_0.mp3'
      ];

      warmAssets.forEach(function(url) {
        try {
          if (/\.jpg$|\.png$/.test(url)) {
            var img = new Image();
            img.src = url;
          } else if (/\.mp3$/.test(url)) {
            var aud = new Audio();
            aud.preload = 'auto';
            aud.src = url;
          }
        } catch(e){}
      });

      function updateProgress(val) {
        if (val > currentProgress) currentProgress = val;
        if (currentProgress > 100) currentProgress = 100;

        if (fillEl) fillEl.style.width = currentProgress + '%';
        if (percentEl) percentEl.textContent = Math.round(currentProgress) + '%';

        if (statusEl) {
          for (var i = statusMessages.length - 1; i >= 0; i--) {
            if (currentProgress >= statusMessages[i].at) {
              statusEl.textContent = statusMessages[i].text;
              break;
            }
          }
        }
      }

      function isStorylineReady() {
        var preso = document.getElementById('preso');
        var presoReady = preso && (preso.offsetWidth > 0 || preso.offsetHeight > 0);
        var slideContainer = document.querySelector('.slide-container, .slide-window, .primary-slide');
        var playerReady = Boolean(window.DS && (window.DS.windowManager || window.DS.pubSub || window.globals));
        return (presoReady || slideContainer) && playerReady;
      }

      function showStartButton() {
        if (isReady) return;
        isReady = true;
        updateProgress(100);

        setTimeout(function() {
          if (progressBox) {
            progressBox.classList.add('starla-box-hidden');
          }
          if (startBtn) {
            startBtn.classList.remove('starla-btn-hidden');
          }
        }, 220);
      }

      var timer = setInterval(function() {
        var elapsed = Date.now() - startTime;
        var ready = isStorylineReady();

        if (elapsed < 600) {
          updateProgress((elapsed / 600) * 45);
        } else if (elapsed < 1200) {
          updateProgress(45 + ((elapsed - 600) / 600) * 45);
        } else {
          if (ready || elapsed >= 2400) {
            updateProgress(100);
            clearInterval(timer);
            showStartButton();
          } else {
            updateProgress(94);
          }
        }
      }, 50);

      // Handle Start Button click (Trusted User Gesture)
      function handleStartAction() {
        if (isStarted) return;
        isStarted = true;
        window.__starlaUserInteracted = true;

        // 1. AudioContext unlock
        try {
          var AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (!window.__storyAudioCtx && AudioCtx) {
            window.__storyAudioCtx = new AudioCtx();
          }
          if (window.__storyAudioCtx && window.__storyAudioCtx.state === 'suspended') {
            window.__storyAudioCtx.resume();
          }
          if (window.DS && window.DS.audioContext) {
            if (typeof window.DS.audioContext.resume === 'function') window.DS.audioContext.resume();
            if (window.DS.audioContext.ctx && typeof window.DS.audioContext.ctx.resume === 'function') {
              window.DS.audioContext.ctx.resume();
            }
          }

      <path fill="white" stroke="white" d="M8.58,5.5 C8.35,5.28,8.5,5.35,8.21,5.32 C8.09,5.35,7.97,5.49,7.96,5.67 C7.97,5.79,7.98,5.92,7.98,6.04 L7.98,6.04 C7.99,6.17,8,6.31,8.01,6.43 L8.01,6.44 C8.03,6.92,8.06,7.41,8.09,7.9 L8.09,7.9 C8.12,8.39,8.14,8.88,8.17,9.37 C8.17,9.39,8.18,9.42,8.2,9.44 C8.23,9.46,8.25,9.47,8.28,9.47 C8.31,9.47,8.34,9.46,8.35,9.44 C8.37,9.43,8.38,9.4,8.39,9.35 L8.39,9.34 C8.39,9.24,8.4,9.15,8.4,9.05 L8.4,9.05 C8.41,8.96,8.41,8.86,8.42,8.75 C8.43,8.44,8.45,8.12,8.47,7.81 L8.47,7.81 C8.49,7.49,8.51,7.18,8.53,6.87 C8.55,6.46,8.56,6.05,8.59,5.64 L8.6,5.62 C8.6,5.57,8.59,5.53,8.58,5.5 L8.21,5.32 Z"/>

<script>
  (function() {
    window.DS.connection = {
      warningShown: false,
      assets: {},
      loadingAssetGroup: false,
      retryDelay: 500
    };

    // @TODO this is POC code and can be cleaned up a bit more if we move forward
    // with the feature



    // The `window.globals.features` variable must be set in `webpack.dev.config` when testing locally - it is not enough
    // to have it in the data - but it must be set there as well.
    var useConnectionMessages = window.AbortController != null &&
      window.location.protocol != 'file:' &&
      window.globals.features.indexOf('ConnectionMessages') != -1;

    window.DS.connection.useConnectionMessages = useConnectionMessages

    var assetCount = 0;
    var checkLoadedId;
    var connectionSettings = window.globals.connectionSettings;

    if (useConnectionMessages && connectionSettings != null) {
      var contentEl = document.querySelector('.warn-connection-content');
      var messageEl = contentEl.querySelector('p')

      if (connectionSettings.useDarkTheme) {
        contentEl.style.borderColor = '#BABBBA';
        contentEl.style.backgroundColor = '#282828';
        contentEl.style.color = '#FFFFFF';
      }

      if (connectionSettings.message != null) {
        messageEl.textContent = window.decodeURIComponent(connectionSettings.message);
      }
    }

    function checkAssetsReady() {
      for (var i in DS.connection.assets) {
        if (!DS.connection.assets[i].success) {
          return false;
        }
      }
      return true;
    }

    function stopAssetGroup() {
      if (!useConnectionMessages) { return; }

      assetCount = 0;

      DS.connection.oldAssetGroup = DS.connection.assets;
      DS.connection.assets = {};
      DS.connection.loadingAssetGroup = false;
      clearInterval(checkLoadedId);
    }

    function startAssetGroup() {
      if (!useConnectionMessages) { return; }
      var ticks = 0;
      clearInterval(checkLoadedId);
      checkLoadedId = setInterval(function() {
        var loaded = 0;
        if (assetCount === 0 && loaded === 0) {
          clearInterval(checkLoadedId);
          return;
        }

        for (var i in DS.connection.assets) {
          if (DS.connection.assets[i].success) {
            loaded++;
          }
        }

        if (assetCount === loaded && checkAssetsReady()) {
          for (var i in DS.connection.assets) {
            if (DS.connection.assets[i].action) {
              DS.connection.assets[i].action();
            }
          }
          hideWarning();
          stopAssetGroup();
        }
      }, 100)
    }

    function requiredAsset(url, action, retry, type) {
      if (!useConnectionMessages) { return; }
      if (DS.connection.assets[url]) { return; }

      DS.connection.assets[url] = {
        success: false, action: action, retry: retry, type: type
      };
      assetCount = Object.keys(DS.connection.assets).length;
      if (!DS.connection.loadingAssetGroup) {
        startAssetGroup();
      }
      DS.connection.loadingAssetGroup = true;
    }

    function assetLoaded(url) {
      if (!useConnectionMessages) { return; }
      if (DS.connection.assets[url]) {
        DS.connection.assets[url].success = true;
      }
    }

    function assetFailed(url) {
      if (!useConnectionMessages) { return; }
      if (!DS.connection.assets[url]) {
        if (/\.js$/.test(url)) {
          setTimeout(function() {
            if (DS.connection.lastSlideLoaded != null) {
              DS.connection.lastSlideLoaded();
            }
          }, DS.connection.retryDelay);
        }
        return;
      }
      if (!DS.connection.warningShown) { showWarning(); }
      if (DS.connection.assets[url].retry) {
        setTimeout(function() {
          if (!DS.connection.assets[url].success) {
            DS.connection.assets[url].retry()
          }
        }, DS.connection.retryDelay);
      }
    }

    function hideWarning() {
      document.body.classList.remove('is-offline');
      DS.connection.warningShown = false;
    }
    DS.connection.hideWarning = hideWarning

    function showWarning(btn) {
      document.body.classList.add('is-offline')
      DS.connection.warningShown = true;
      updateWarningPosition();
    }

    function updateWarningPosition() {
      if (!DS.connection.warningShown) {
        return;
      }

      var isPortrait = document.body.classList.contains('is-portrait');
      var warningEl = document.querySelector('.warn-connection-content');

      if (isPortrait) {
        var slide = document.querySelector('.primary-slide');
        var slideRect = slide.getBoundingClientRect();

        warningEl.style.top = `${slideRect.top}px`
        warningEl.style.left = `${slideRect.left + slideRect.width / 2}px`
      } else {
        warningEl.style.top = null;
        warningEl.style.left = null;
      }

      window.requestAnimationFrame(updateWarningPosition);
    }

    // these will all be noops if the feature flag isn't set in
    // the data and `window.globals.features`
    DS.connection.requiredAsset = requiredAsset;
    DS.connection.assetLoaded = assetLoaded;
    DS.connection.assetFailed = assetFailed;
    DS.connection.stopAssetGroup = stopAssetGroup;
    DS.connection.startAssetGroup = startAssetGroup;
  })();
</script>
