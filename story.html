    #preso {
      position: absolute !important;

      box-shadow: none !important;
      border: none !important;

    .cs-area-primary,

      opacity: 0 !important;
      pointer-events: none !important;
      visibility: hidden !important;
    }

    /* 5. Mobile Legends Floating Game HUD Banner */
    .starla-hud-banner {
      position: fixed;
      top: 14px;
      left: 50%;
      transform: translateX(-50%) translateY(0);
      z-index: 99995;
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(11, 19, 43, 0.94);
      border: 1px solid rgba(245, 158, 11, 0.65);
      box-shadow: 0 10px 32px rgba(0, 0, 0, 0.75), 0 0 22px rgba(245, 158, 11, 0.3);
      border-radius: 999px;
      padding: 8px 18px 8px 14px;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      transition: all 0.45s cubic-bezier(0.16, 1, 0.3, 1);
      user-select: none;
      -webkit-user-select: none;
      max-width: 90vw;
      box-sizing: border-box;
    }

    .starla-hud-banner.starla-hud-hidden {
      transform: translateX(-50%) translateY(-120px);
      opacity: 0;
      pointer-events: none;
    }

    .starla-hud-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
      color: #0b132b;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      padding: 4px 10px;
      border-radius: 999px;
      box-shadow: 0 2px 8px rgba(245, 158, 11, 0.4);
      flex-shrink: 0;
    }

    .starla-hud-text {
      font-size: 13px;
      font-weight: 500;
      color: #e2e8f0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .starla-hud-name {
      color: #60a5fa;
      font-weight: 700;
    }

    .starla-hud-school {
      color: #fbbf24;
      font-weight: 600;
    }

    .starla-hud-switch-btn {
      background: rgba(239, 68, 68, 0.2);
      border: 1px solid rgba(239, 68, 68, 0.5);
      color: #fca5a5;
      font-size: 11px;
      font-weight: 700;
      padding: 5px 12px;
      border-radius: 999px;
      cursor: pointer;
      transition: all 0.2s ease;
      outline: none;
      flex-shrink: 0;
    }

    .starla-hud-switch-btn:hover {
      background: rgba(239, 68, 68, 0.4);
      color: #ffffff;
      border-color: #ef4444;
      transform: scale(1.04);
    }

    /* Discreet Mini Switch Account Button (Persistent in Corner) */
    .starla-mini-switch-btn {
      position: fixed;
      top: 10px;
      right: 14px;
      z-index: 99990;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(15, 23, 42, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.18);
      color: #cbd5e1;
      font-size: 11px;
      font-weight: 600;
      padding: 5px 11px;
      border-radius: 999px;
      cursor: pointer;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);

      opacity: 0.85;
      outline: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    .starla-mini-switch-btn:hover {
      opacity: 1;
      background: rgba(15, 23, 42, 0.95);
      border-color: rgba(245, 158, 11, 0.6);
      color: #fbbf24;
      transform: translateY(1px);
    }

    /* 6. Sound Pill (Smart Autoplay Cascade) */
    .starla-sound-pill {
      position: fixed;
      bottom: 22px;
      right: 22px;
      z-index: 99996;
      opacity: 0;
      visibility: hidden;
      transform: translateY(14px);
      transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    .starla-sound-pill.visible {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
    }

    .starla-sound-card {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(15, 23, 42, 0.92);
      border: 1px solid rgba(251, 191, 36, 0.6);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.65), 0 0 18px rgba(251, 191, 36, 0.3);
      border-radius: 999px;
      padding: 10px 18px;
      color: #fbbf24;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 13px;
      font-weight: 600;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      animation: soundPillPulse 2s infinite ease-in-out;
    }

    @keyframes soundPillPulse {
      0%, 100% {
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.65), 0 0 16px rgba(251, 191, 36, 0.3);
      }
      50% {
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.65), 0 0 28px rgba(251, 191, 36, 0.6);
      }
    }

    .starla-sound-icon {
      font-size: 16px;
      display: flex;
      align-items: center;
    }

    /* 7. Smart Orientation Notification (Mobile Portrait) */
    .smart-orientation-alert {
      position: fixed;
      top: 16px;
      left: 50%;
      transform: translateX(-50%) translateY(-120px);
      z-index: 100000;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      width: calc(100% - 32px);

      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    .smart-orientation-alert.visible {
      opacity: 1;
      visibility: visible;
      transform: translateX(-50%) translateY(0);
      pointer-events: auto;
    }

    .smart-orientation-card {
      display: flex;
      align-items: center;
      gap: 14px;
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid rgba(245, 158, 11, 0.5);
      border-radius: 16px;
      padding: 14px 18px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      color: #ffffff;
    }

    .smart-phone-icon {
      position: relative;
      flex-shrink: 0;
      width: 38px;
      height: 38px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fbbf24;
    }

    .smart-phone-icon svg {
      width: 26px;
      height: 26px;
      animation: phoneRotateAnim 2.4s ease-in-out infinite;
    }

    @keyframes phoneRotateAnim {
      0%, 15% { transform: rotate(0deg); }

    .smart-orientation-text {
      flex: 1;
      text-align: left;
    }

    .smart-orientation-title {
      font-size: 13px;
      font-weight: 700;
      color: #fbbf24;
      margin-bottom: 3px;
    }

    .smart-orientation-desc {
      font-size: 11px;
      color: #e2e8f0;
      line-height: 1.4;
    }

    /* 8. Game Blur Mode for Feedback Layers (Benar & Salah) */
    .slide-layer:not(.base-layer) {

    .slide-layer:not(.base-layer).starla-feedback-benar {

      filter: none !important;

      }

      function loadSession() {
        try {
          var raw = localStorage.getItem(STORAGE_KEY);
          if (raw) {
            var parsed = JSON.parse(raw);
            if (parsed && parsed.nama && parsed.sekolah) {
              return parsed;
            }

        } catch(e) {}

      }

      function saveSession(data) {
        try {
          if (!data) {
            localStorage.removeItem(STORAGE_KEY);

            data.updatedAt = Date.now();

              keysToClear.push(k);
            }
          }
          keysToClear.forEach(function(k) { localStorage.removeItem(k); });
        } catch(e) {}
      }

      // Mobile device detector
      function isMobileDevice() {
        return (
          (window.isMobile && window.isMobile.any) ||
          /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) ||

      // Orientation checker
      function updateOrientationAlert() {
        if (!el.orientationAlert) return;
        var isPortrait = window.innerHeight > window.innerWidth;
        if (isMobileDevice() && isPortrait) {
          el.orientationAlert.classList.add('visible');

          el.orientationAlert.classList.remove('visible');

      // AudioContext Unlocker
      function unlockAudioContext() {
        try {

            var buf = window.__storyAudioCtx.createBuffer(1, 1, 22050);

            src.buffer = buf;
            src.connect(window.__storyAudioCtx.destination);

          }

        if (window.DS && window.DS.audioContext) {
          try {
            if (typeof window.DS.audioContext.resume === 'function') window.DS.audioContext.resume();
            if (window.DS.audioContext.ctx && typeof window.DS.audioContext.ctx.resume === 'function') {
              window.DS.audioContext.ctx.resume();
            }
          } catch(e) {}

      }

      // Fullscreen & Screen Orientation Request
      function enterFullscreenAndLandscape() {
        if (!isMobileDevice()) return;

        try {
          var docEl = document.documentElement;
          var rfs = docEl.requestFullscreen || docEl.webkitRequestFullscreen || docEl.msRequestFullscreen || docEl.mozRequestFullScreen;

      function navigateToSlide(slideId) {
        if (!slideId) return false;

          if (window.DS && window.DS.pubSub) {
            window.DS.pubSub.trigger('nextSlide:requesting', fullRef);
            return true;
          }
        } catch(e) {
          console.warn('[StarlaGameEngine] Navigation notice:', e);
        }
        return false;
      }

      // Get Current Slide ID
      function getCurrentSlideId() {
        try {
          if (window.DS && window.DS.windowManager) {
            var cur = window.DS.windowManager.getCurrentWindowSlide();
            if (cur) {
              if (cur.id) return cur.id;
              if (cur.absoluteId) {
                var parts = cur.absoluteId.split('.');
                return parts[parts.length - 1];
              }
            }
          }
        } catch(e) {}
        try {
          if (window.GetPlayer) {
            var last = window.GetPlayer().GetVar('LastSlideViewed_5jpgil4RGjK');
            if (last) {
              var p = last.split('.');
              return p[p.length - 1];
            }
          }
        } catch(e) {}
        return null;
      }

      // Autoplay Cascade for Intro Video
      function attemptVideoAutoplay() {
        var videos = document.querySelectorAll('video');
        if (!videos.length) return false;

        videos.forEach(function(video) {
          if (video.__starlaAutoplayHandled) return;
          video.__starlaAutoplayHandled = true;

          // Attempt full-sound autoplay first
          video.muted = false;
          var promise = video.play();
          if (promise && typeof promise.catch === 'function') {
            promise.catch(function() {
              // Muted autoplay fallback
              video.muted = true;
              video.play().then(function() {
                if (!state.userInteracted && el.soundPill) {
                  el.soundPill.classList.add('visible');
                }
              }).catch(function(){});
            });
          }
        });
        return true;
      }

      // First User Touch/Click Global Handler
      function handleFirstInteraction() {
        if (state.userInteracted) return;
        state.userInteracted = true;

        // Unmute video without resetting time
        var videos = document.querySelectorAll('video');
        videos.forEach(function(v) {
          try { v.muted = false; } catch(e){}
        });

        // Hide sound pill
        if (el.soundPill) {

      // Apply Game Blur Mode to feedback layers
      function processFeedbackLayers() {

          var layerModelId = layer.getAttribute('data-model-id') || '';

          FEEDBACK_LAYERS.BENAR.forEach(function(id) {

            isBenar = true;
          }

          // Check for Salah
          var isSalah = false;
          FEEDBACK_LAYERS.SALAH.forEach(function(id) {
            if (layerModelId === id || layerHtml.indexOf(id) !== -1) isSalah = true;
          });
          if (!isSalah && (layerHtml.indexOf('Slide6CCYce11Vkv') !== -1 || layerHtml.indexOf('Salah') !== -1 || layerHtml.indexOf('6mxkFyRe2qp_IncorrectReview') !== -1)) {
            isSalah = true;

          if (isBenar) {
            layer.classList.remove('starla-feedback-salah');
            layer.classList.add('starla-feedback-benar');
          } else if (isSalah) {
            layer.classList.remove('starla-feedback-benar');
            layer.classList.add('starla-feedback-salah');
          }

      // Show MLBB HUD Banner
      function showHudBanner(nama, sekolah) {

      function runCycle() {

        if (!window.GetPlayer) return;

              nama: curNama,
              sekolah: curSekolah,
              cek_login: true,
              poin: curPoin || 0,
              score: curScore || 0,
              lastSlideId: curSlideId || SLIDES.MENU_UTAMA,

        if (state.session && curSlideId) {

          if (curSlideId !== SLIDES.INTRO && curSlideId !== SLIDES.LOGIN) {
            if (state.session.lastSlideId !== curSlideId) {

              updated = true;

          if (curSlideId === SLIDES.KUIS_CERT) {
            if (!state.session.kuisCompleted) {
              state.session.kuisCompleted = true;
              updated = true;
              console.log('[StarlaGameEngine] Kuis Budaya diselesaikan oleh murid!');
            }
            if (curScore) {
              state.session.score = curScore;
              updated = true;
            }
          }

          if (curSlideId === SLIDES.GAME_CERT) {
            if (!state.session.gameCompleted) {
              state.session.gameCompleted = true;
              updated = true;
              console.log('[StarlaGameEngine] Game Anak Garuda diselesaikan oleh murid!');
            }
            if (curPoin) {
              state.session.poin = curPoin;
              updated = true;
            }

            saveSession(state.session);
          }

      // Initialization
      function init() {

    })();

        mobile: window.isMobile.any || isMobileOverride,
        phone: isPhoneOverride || (window.isMobile.phone && !isTabletOverride),
        tablet: isTabletOverride || window.isMobile.tablet
      };

      window.globals.deviceView = deviceView;
      window.isMobile.desktop = !window.isMobile.any;

<script>
  (function() {
    window.DS.connection = {
      warningShown: false,
      assets: {},
      loadingAssetGroup: false,
      retryDelay: 500
    };

    // @TODO this is POC code and can be cleaned up a bit more if we move forward
    // with the feature



    // The `window.globals.features` variable must be set in `webpack.dev.config` when testing locally - it is not enough
    // to have it in the data - but it must be set there as well.
    var useConnectionMessages = window.AbortController != null &&
      window.location.protocol != 'file:' &&
      window.globals.features.indexOf('ConnectionMessages') != -1;

    window.DS.connection.useConnectionMessages = useConnectionMessages

    var assetCount = 0;
    var checkLoadedId;
    var connectionSettings = window.globals.connectionSettings;

    if (useConnectionMessages && connectionSettings != null) {
      var contentEl = document.querySelector('.warn-connection-content');
      var messageEl = contentEl.querySelector('p')

      if (connectionSettings.useDarkTheme) {
        contentEl.style.borderColor = '#BABBBA';
        contentEl.style.backgroundColor = '#282828';
        contentEl.style.color = '#FFFFFF';
      }

      if (connectionSettings.message != null) {
        messageEl.textContent = window.decodeURIComponent(connectionSettings.message);
      }
    }

    function checkAssetsReady() {
      for (var i in DS.connection.assets) {
        if (!DS.connection.assets[i].success) {
          return false;
        }
      }
      return true;
    }

    function stopAssetGroup() {
      if (!useConnectionMessages) { return; }

      assetCount = 0;

      DS.connection.oldAssetGroup = DS.connection.assets;
      DS.connection.assets = {};
      DS.connection.loadingAssetGroup = false;
      clearInterval(checkLoadedId);
    }

    function startAssetGroup() {
      if (!useConnectionMessages) { return; }
      var ticks = 0;
      clearInterval(checkLoadedId);
      checkLoadedId = setInterval(function() {
        var loaded = 0;
        if (assetCount === 0 && loaded === 0) {
          clearInterval(checkLoadedId);
          return;
        }

        for (var i in DS.connection.assets) {
          if (DS.connection.assets[i].success) {
            loaded++;
          }
        }

        if (assetCount === loaded && checkAssetsReady()) {
          for (var i in DS.connection.assets) {
            if (DS.connection.assets[i].action) {
              DS.connection.assets[i].action();
            }
          }
          hideWarning();
          stopAssetGroup();
        }
      }, 100)
    }

    function requiredAsset(url, action, retry, type) {
      if (!useConnectionMessages) { return; }
      if (DS.connection.assets[url]) { return; }

      DS.connection.assets[url] = {
        success: false, action: action, retry: retry, type: type
      };
      assetCount = Object.keys(DS.connection.assets).length;
      if (!DS.connection.loadingAssetGroup) {
        startAssetGroup();
      }
      DS.connection.loadingAssetGroup = true;
    }

    function assetLoaded(url) {
      if (!useConnectionMessages) { return; }
      if (DS.connection.assets[url]) {
        DS.connection.assets[url].success = true;
      }
    }

    function assetFailed(url) {
      if (!useConnectionMessages) { return; }
      if (!DS.connection.assets[url]) {
        if (/\.js$/.test(url)) {
          setTimeout(function() {
            if (DS.connection.lastSlideLoaded != null) {
              DS.connection.lastSlideLoaded();
            }
          }, DS.connection.retryDelay);
        }
        return;
      }
      if (!DS.connection.warningShown) { showWarning(); }
      if (DS.connection.assets[url].retry) {
        setTimeout(function() {
          if (!DS.connection.assets[url].success) {
            DS.connection.assets[url].retry()
          }
        }, DS.connection.retryDelay);
      }
    }

    function hideWarning() {
      document.body.classList.remove('is-offline');
      DS.connection.warningShown = false;
    }
    DS.connection.hideWarning = hideWarning

    function showWarning(btn) {
      document.body.classList.add('is-offline')
      DS.connection.warningShown = true;
      updateWarningPosition();
    }

    function updateWarningPosition() {
      if (!DS.connection.warningShown) {
        return;
      }

      var isPortrait = document.body.classList.contains('is-portrait');
      var warningEl = document.querySelector('.warn-connection-content');

      if (isPortrait) {
        var slide = document.querySelector('.primary-slide');
        var slideRect = slide.getBoundingClientRect();

        warningEl.style.top = `${slideRect.top}px`
        warningEl.style.left = `${slideRect.left + slideRect.width / 2}px`
      } else {
        warningEl.style.top = null;
        warningEl.style.left = null;
      }

      window.requestAnimationFrame(updateWarningPosition);
    }

    // these will all be noops if the feature flag isn't set in
    // the data and `window.globals.features`
    DS.connection.requiredAsset = requiredAsset;
    DS.connection.assetLoaded = assetLoaded;
    DS.connection.assetFailed = assetFailed;
    DS.connection.stopAssetGroup = stopAssetGroup;
    DS.connection.startAssetGroup = startAssetGroup;
  })();
</script>
